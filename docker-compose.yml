services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: naira
      POSTGRES_USER: naira
      POSTGRES_PASSWORD: naira
    volumes:
      - naira-postgres:/var/lib/postgresql/data
      - ./infra/local/init-postgres.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naira -d naira']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  object-storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - naira-object-storage:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ['/usr/local/bin/naira-migrate']
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://naira:naira@postgres:5432/naira?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDRESS: ':8080'
      DATABASE_URL: postgres://naira:naira@postgres:5432/naira?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      CORS_ORIGINS: http://localhost:4322,http://localhost:5174
    ports:
      - '8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ['/usr/local/bin/naira-worker']
    environment:
      APP_ENV: local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: infra/docker/site.Dockerfile
    ports:
      - '4322:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8080/health >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
    environment:
      ORIGIN: http://localhost:5174
      PORT: '3000'
      HOST: 0.0.0.0
    ports:
      - '5174:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/app').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  naira-postgres:
  naira-object-storage:
