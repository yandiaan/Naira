version: '3'

tasks:
  format:
    desc: Check formatting
    cmds:
      - pnpm exec prettier --check .

  format:write:
    desc: Format repository files
    cmds:
      - pnpm exec prettier --write .

  commitlint:
    desc: Check the latest commit message
    cmds:
      - pnpm exec commitlint --from=HEAD~1 --to=HEAD

  check:repo:
    desc: Run repository checks
    deps: [format]

  ui:workbench:
    desc: Start the Svelte component workbench
    cmds:
      - pnpm --dir packages/ui-svelte exec storybook dev -c .storybook --port 6006

  ui:tokens:check:
    desc: Validate generated design tokens
    cmds:
      - pnpm --filter @naira/design-tokens build
      - pnpm --filter @naira/design-tokens test
      - pnpm --filter @naira/design-tokens check

  ui:styles:check:
    desc: Validate token-backed UI styles
    cmds:
      - pnpm --filter @naira/ui-svelte check
      - pnpm --filter @naira/ui-svelte test

  ui:check:
    desc: Validate the UI package and workbench
    deps: [ui:tokens:check]
    cmds:
      - node scripts/storybook-catalog.test.mjs
      - task ui:styles:check
      - task ui:workbench:build

  ui:a11y:
    desc: Run design-system accessibility browser checks
    cmds:
      - pnpm exec playwright test tests/e2e/design-system-a11y.spec.ts
      - pnpm exec playwright test tests/e2e/storybook.spec.ts

  ui:visual:
    desc: Run design-system visual browser checks
    cmds:
      - pnpm exec playwright test tests/e2e/design-system-visual.spec.ts

  docs:check:
    desc: Validate local documentation links and formatting
    cmds:
      - node scripts/check-doc-links.mjs
      - pnpm exec prettier --check docs

  ui:workbench:build:
    desc: Build the Svelte component workbench
    cmds:
      - pnpm --dir packages/ui-svelte exec storybook build -c .storybook -o storybook-static

  web:test:e2e:
    desc: Run public and workspace browser smoke tests
    cmds:
      - pnpm exec playwright test

  api:format:
    desc: Format Go source
    dir: services/api
    cmds:
      - gofmt -w .

  api:test:
    desc: Run Go tests
    dir: services/api
    cmds:
      - go test ./...

  api:build:
    desc: Build API and worker
    dir: services/api
    cmds:
      - go build ./cmd/api
      - go build ./cmd/worker

  api:migrate:
    desc: Apply PostgreSQL migrations
    dir: services/api
    cmds:
      - go run ./cmd/migrate

  api:worker:test:
    desc: Test worker lifecycle
    dir: services/api
    cmds:
      - go test ./internal/platform/jobs

  api:run:
    desc: Run API locally
    dir: services/api
    cmds:
      - go run ./cmd/api

  api:worker:
    desc: Run worker locally
    dir: services/api
    cmds:
      - go run ./cmd/worker

  release:validate:
    desc: Validate a semantic release tag
    cmds:
      - pnpm release:validate --tag v0.1.0

  release:version:
    desc: Print build version metadata
    cmds:
      - pnpm release:version

  check:
    desc: Run full validation checks
    cmds:
      - cmd: powershell -File infra/ci/validate.ps1
        platforms: [windows]
      - cmd: sh infra/ci/validate.sh
        platforms: [linux, darwin]

  test:
    desc: Run unit and package tests
    deps: [check]

  test:integration:
    desc: Run dependency-backed integration tests
    cmds:
      - cmd: powershell -File infra/ci/integration.ps1
        platforms: [windows]
      - cmd: sh infra/ci/integration.sh
        platforms: [linux, darwin]

  build:
    desc: Build web and backend artifacts
    cmds:
      - pnpm --filter @naira/design-tokens build
      - pnpm --filter site build
      - pnpm --filter workspace build
      - task api:build

  docker:build:
    desc: Build application Docker images
    cmds:
      - cmd: powershell -File infra/ci/build-images.ps1
        platforms: [windows]
      - cmd: sh infra/ci/build-images.sh
        platforms: [linux, darwin]

  security:
    desc: Run dependency and image security scans
    cmds:
      - cmd: powershell -File infra/ci/security.ps1
        platforms: [windows]
      - cmd: sh infra/ci/security.sh
        platforms: [linux, darwin]

  sbom:
    desc: Generate image SBOM artifacts
    cmds:
      - cmd: powershell -File infra/ci/sbom.ps1
        platforms: [windows]
      - cmd: sh infra/ci/sbom.sh
        platforms: [linux, darwin]

  smoke:
    desc: Run post-deploy smoke checks
    cmds:
      - cmd: powershell -File infra/ci/smoke.ps1
        platforms: [windows]
      - cmd: sh infra/ci/smoke.sh
        platforms: [linux, darwin]

  release:
    desc: Validate and package a release
    cmds:
      - cmd: powershell -File infra/ci/release.ps1
        platforms: [windows]
      - cmd: sh infra/ci/release.sh
        platforms: [linux, darwin]

  api:contract:check:
    desc: Validate and test the OpenAPI contract
    cmds:
      - pnpm --dir packages/api-contracts test

  api:contract:generate:
    desc: Generate TypeScript API contract files
    cmds:
      - pnpm --dir packages/api-contracts generate
